<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamix Store - Líderes en Entretenimiento</title>
    <link rel="icon" type="image/png" href="./favicon.png?v=2">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050811; color: #ffffff; padding: 0; overflow-x: hidden; }
        
        /* Navegación Estilo AssaX */
        nav { background: #0b0f19; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid #1f2937; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100; }
        
        .logo-nav { font-weight: 900; font-size: 1.6rem; letter-spacing: 1px; color: #fff; display: flex; align-items: center; text-transform: uppercase; }
        .logo-nav span { color: #00FF7F; }

        .nav-links { display: flex; gap: 25px; align-items: center; list-style: none; font-size: 0.9rem; }
        .nav-item-dropdown { position: relative; }
        .nav-links a { color: #d1d5db; text-decoration: none; transition: color 0.2s; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 500; }
        .nav-links a:hover { color: #00FF7F; }
        .nav-links svg { width: 12px; height: 12px; fill: currentColor; }

        .nav-right-actions { display: flex; align-items: center; gap: 15px; }
        
        .search-icon-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; transition: color 0.2s; }
        .search-icon-btn:hover { color: #00FF7F; }
        .search-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .btn-region { background: #111827; border: 1px solid #374151; color: #ffffff; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s, background 0.2s; }
        .btn-region:hover { border-color: #00FF7F; background: #1a2332; }
        .globe-icon { color: #00FF7F; width: 16px; height: 16px; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 30px; }

        /* MODAL DE REGIÓN Y MONEDA (Imagen 2 y 4) */
        .region-modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(6px); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 999999; 
        }
        
        .region-modal-card { 
            background: #0e1320; 
            border: 1px solid #2b3548; 
            width: 90%; 
            max-width: 440px; 
            border-radius: 20px; 
            padding: 25px; 
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
        }
        
        .region-modal-close { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: #1a2234; 
            border: none; 
            color: #9ca3af; 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.1rem; 
            transition: all 0.2s;
        }
        .region-modal-close:hover { background: #2b3548; color: white; }
        
        .region-modal-title { font-size: 1.2rem; font-weight: bold; color: white; margin-bottom: 4px; }
        .region-modal-subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 20px; }

        .region-option { 
            background: #161d2e; 
            border: 1px solid #2b3548; 
            border-radius: 14px; 
            padding: 14px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            cursor: pointer; 
            transition: border-color 0.2s, background 0.2s; 
        }
        .region-option:hover { border-color: #00FF7F; background: #1c263c; }
        .region-option.active { border-color: #00FF7F; background: #142232; }
        
        .region-info { display: flex; align-items: center; gap: 14px; }
        
        /* Estilos para los iconos circulares */
        .region-icon-circle { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            flex-shrink: 0;
            background: #121929;
            border: 1px solid #253147;
        }
        
        .region-icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .region-icon-circle svg {
            width: 20px;
            height: 20px;
            fill: #00FF7F;
        }

        .region-name { font-weight: bold; font-size: 0.95rem; color: white; }
        .region-currency { font-size: 0.8rem; color: #9ca3af; margin-top: 2px; }
        
        .region-radio { 
            width: 26px; 
            height: 26px; 
            border-radius: 50%; 
            border: 2px solid #374151; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #0b0f19; 
            color: #050811;
            font-weight: bold;
            font-size: 13px;
        }

        .arrow-icon {
            color: #4b5563;
            font-size: 14px;
        }

        .region-option.active .region-radio { 
            background: #00FF7F; 
            border-color: #00FF7F; 
        }

        /* Carrusel */
        .carousel-container { position: relative; width: 100%; max-width: 1100px; margin: 0 auto; overflow: hidden; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); background-color: #0d0d11; }
        .carousel-track { display: flex; transition: transform 0.5s ease-in-out; width: 100%; }
        .carousel-slide { min-width: 100%; box-sizing: border-box; }
        .carousel-slide img { width: 100%; height: auto; display: block; object-fit: cover; }
        .carousel-indicators { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
        .dot { width: 24px; height: 4px; background-color: rgba(255, 255, 255, 0.3); border-radius: 2px; cursor: pointer; transition: background-color 0.3s ease, width 0.3s ease; }
        .dot.active { background-color: #00FF7F; width: 32px; }
    </style>
</head>
<body>

    <!-- Navegación -->
    <nav>
        <div class="logo-nav">
            ASSA<span>X</span>
        </div>
        <ul class="nav-links">
            <li class="nav-item-dropdown">
                <a href="#catalogo">Recargas 
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </a>
            </li>
            <li class="nav-item-dropdown">
                <a href="#catalogo">Gift Cards 
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </a>
            </li>
            <li class="nav-item-dropdown">
                <a href="#catalogo">Servicios 
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </a>
            </li>
            <li><a href="#catalogo">Reseñas</a></li>
            <li><a href="#catalogo">Soporte</a></li>
        </ul>
        
        <div class="nav-right-actions">
            <!-- Botón Lupa de Búsqueda -->
            <button class="search-icon-btn" onclick="alert('Búsqueda activada')" title="Buscar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>

            <!-- Botón de Región y Moneda -->
            <button class="btn-region" id="btnRegionTrigger">
                <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span id="label-moneda">VES</span>
            </button>
        </div>
    </nav>

    <!-- Modal de Región y Moneda -->
    <div class="region-modal-overlay" id="modalRegion">
        <div class="region-modal-card">
            <button class="region-modal-close" id="btnCloseRegion">✕</button>
            <div class="region-modal-title">Región y Moneda</div>
            <div class="region-modal-subtitle">Elige la divisa en la que deseas ver el catálogo</div>

            <!-- Opción Global -->
            <div class="region-option" id="optGlobal" onclick="seleccionarMoneda('USD')">
                <div class="region-info">
                    <div class="region-icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    </div>
                    <div>
                        <div class="region-name">Global</div>
                        <div class="region-currency">USD · $</div>
                    </div>
                </div>
                <div class="arrow-icon" id="arrowGlobal">❯</div>
                <div class="region-radio" id="radioGlobal" style="display: none;"></div>
            </div>

            <!-- Opción Venezuela (con bandera circular oficial) -->
            <div class="region-option active" id="optVES" onclick="seleccionarMoneda('VES')">
                <div class="region-info">
                    <div class="region-icon-circle">
                        <!-- Flagicon circular oficial de Venezuela con estrellas -->
                        <img src="https://flagcdn.com/w80/ve.png" alt="Venezuela">
                    </div>
                    <div>
                        <div class="region-name">Venezuela</div>
                        <div class="region-currency">VES · Bs.</div>
                    </div>
                </div>
                <div class="region-radio" id="radioVES">✓</div>
            </div>
        </div>
    </div>

    <div class="container">
        <header style="text-align: center; margin-bottom: 40px;">
            <h1>AssaX Store</h1>
            <p>Líderes en Entretenimiento</p>
        </header>

        <!-- Carrusel Principal -->
        <div class="carousel-container">
            <div class="carousel-track">
                <div class="carousel-slide"><img src="https://i.imgur.com/wMd8QmY.jpeg" alt="Banner 1"></div>
                <div class="carousel-slide"><img src="https://i.imgur.com/QLg6Fnl.png" alt="Banner 2"></div>
                <div class="carousel-slide"><img src="https://i.imgur.com/i6K1rEH.png" alt="Banner 3"></div>
            </div>
            <div class="carousel-indicators">
                <span class="dot active" onclick="goToSlide(0)"></span>
                <span class="dot" onclick="goToSlide(1)"></span>
                <span class="dot" onclick="goToSlide(2)"></span>
            </div>
        </div>
    </div>

    <script>
        const btnRegionTrigger = document.getElementById('btnRegionTrigger');
        const modalRegion = document.getElementById('modalRegion');
        const btnCloseRegion = document.getElementById('btnCloseRegion');
        const labelMoneda = document.getElementById('label-moneda');

        btnRegionTrigger.addEventListener('click', function() {
            modalRegion.style.display = 'flex';
        });

        btnCloseRegion.addEventListener('click', function() {
            modalRegion.style.display = 'none';
        });

        window.addEventListener('click', function(event) {
            if (event.target === modalRegion) {
                modalRegion.style.display = 'none';
            }
        });

        function seleccionarMoneda(moneda) {
            labelMoneda.innerText = moneda;

            const optGlobal = document.getElementById('optGlobal');
            const optVES = document.getElementById('optVES');
            const radioGlobal = document.getElementById('radioGlobal');
            const radioVES = document.getElementById('radioVES');
            const arrowGlobal = document.getElementById('arrowGlobal');

            if (moneda === 'VES') {
                optVES.classList.add('active');
                optGlobal.classList.remove('active');
                
                radioVES.style.display = 'flex';
                radioVES.innerText = '✓';
                
                radioGlobal.style.display = 'none';
                arrowGlobal.style.display = 'block';
            } else {
                optGlobal.classList.add('active');
                optVES.classList.remove('active');
                
                radioGlobal.style.display = 'flex';
                radioGlobal.innerText = '✓';
                
                arrowGlobal.style.display = 'none';
                radioVES.style.display = 'none';
            }

            modalRegion.style.display = 'none';
        }

        // Lógica del Carrusel
        let currentSlide = 0;
        const dots = document.querySelectorAll('.carousel-indicators .dot');

        function goToSlide(index) {
            currentSlide = index;
            document.querySelector('.carousel-track').style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        }
    </script>
</body>
</html>
