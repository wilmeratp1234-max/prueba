<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamix Store - Líderes en Entretenimiento</title>
    <link rel="icon" type="image/png" href="./favicon.png?v=2">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050811; color: #ffffff; padding: 0; overflow-x: hidden; }
        
        /* Navegación Estilo AssaX */
        nav { background: #0b0f19; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid #1f2937; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100; }
        
        .logo-nav { font-weight: 900; font-size: 1.6rem; letter-spacing: 1px; color: #fff; display: flex; align-items: center; text-transform: uppercase; }
        .logo-nav span { color: #00FF7F; }

        .nav-links { display: flex; gap: 25px; align-items: center; list-style: none; font-size: 0.9rem; }
        .nav-item-dropdown { position: relative; }
        .nav-links a { color: #d1d5db; text-decoration: none; transition: color 0.2s; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 500; }
        .nav-links a:hover { color: #00FF7F; }
        .nav-links svg { width: 12px; height: 12px; fill: currentColor; }

        .nav-right-actions { display: flex; align-items: center; gap: 15px; }
        
        .search-icon-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px; transition: color 0.2s; }
        .search-icon-btn:hover { color: #00FF7F; }
        .search-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .btn-region { background: #111827; border: 1px solid #374151; color: #ffffff; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s; }
        .btn-region:hover { border-color: #00FF7F; }
        .globe-icon { color: #00FF7F; width: 16px; height: 16px; }

        .btn-ingresar { background: #00FF7F; color: #050811; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-ingresar:hover { background: #00cc66; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 30px; }

        /* MODAL DE REGIÓN Y MONEDA (Imagen 2) */
        .region-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .region-modal-card { background: #0e1320; border: 1px solid #2b3548; width: 90%; max-width: 440px; border-radius: 20px; padding: 25px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .region-modal-close { position: absolute; top: 20px; right: 20px; background: #1a2234; border: none; color: #9ca3af; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .region-modal-close:hover { background: #2b3548; color: white; }
        
        .region-modal-title { font-size: 1.15rem; font-weight: bold; color: white; margin-bottom: 4px; }
        .region-modal-subtitle { font-size: 0.82rem; color: #9ca3af; margin-bottom: 20px; }

        .region-option { background: #161d2e; border: 1px solid #2b3548; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; cursor: pointer; transition: border-color 0.2s; }
        .region-option:hover, .region-option.active { border-color: #00FF7F; }
        .region-info { display: flex; align-items: center; gap: 12px; }
        .region-flag { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .region-name { font-weight: bold; font-size: 0.95rem; color: white; }
        .region-currency { font-size: 0.78rem; color: #9ca3af; }
        
        .region-radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #374151; display: flex; align-items: center; justify-content: center; background: #0b0f19; }
        .region-option.active .region-radio { background: #00FF7F; border-color: #00FF7F; color: #050811; font-size: 12px; font-weight: bold; }

        /* Carrusel y demás componentes base */
        .carousel-container { position: relative; width: 100%; max-width: 1100px; margin: 0 auto; overflow: hidden; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); background-color: #0d0d11; }
        .carousel-track { display: flex; transition: transform 0.5s ease-in-out; width: 100%; }
        .carousel-slide { min-width: 100%; box-sizing: border-box; }
        .carousel-slide img { width: 100%; height: auto; display: block; object-fit: cover; }
        .carousel-indicators { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
        .dot { width: 24px; height: 4px; background-color: rgba(255, 255, 255, 0.3); border-radius: 2px; cursor: pointer; transition: background-color 0.3s ease, width 0.3s ease; }
        .dot.active { background-color: #00FF7F; width: 32px; }

        @media(max-width: 768px) {
            nav { padding: 12px 20px; }
            .nav-links { display: none; } /* Ocultar menú en móviles o adaptar */
        }
    </style>
</head>
<body>

    <!-- Barra de navegación exacta a la imagen 1 -->
    <nav>
        <div class="logo-nav">
            ASSA<span>X</span>
        </div>
        <ul class="nav-links">
            <li class="nav-item-dropdown">
                <a href="#catalogo">Recargas 
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </a>
            </li>
            <li class="nav-item-dropdown">
                <a href="#catalogo">Gift Cards 
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </a>
            </li>
            <li class="nav-item-dropdown">
                <a href="#catalogo">Servicios 
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                </a>
            </li>
            <li><a href="#catalogo">Reseñas</a></li>
            <li><a href="#catalogo">Soporte</a></li>
        </ul>
        
        <div class="nav-right-actions">
            <!-- Botón de Lupa de Búsqueda -->
            <button class="search-icon-btn" onclick="alert('Función de búsqueda rápida')" title="Buscar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>

            <!-- Botón VES que abre el Modal de la Imagen 2 -->
            <button class="btn-region" onclick="abrirModalRegion()">
                <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span id="label-moneda">VES</span>
            </button>

            <!-- Botón Ingresar -->
            <a href="#ingresar" class="btn-ingresar">Ingresar</a>
        </div>
    </nav>

    <!-- Modal de Región y Moneda (Imagen 2) -->
    <div class="region-modal-overlay" id="modalRegion">
        <div class="region-modal-card">
            <button class="region-modal-close" onclick="cerrarModalRegion()">✕</button>
            <div class="region-modal-title">Región y Moneda</div>
            <div class="region-modal-subtitle">Elige la divisa en la que deseas ver el catálogo</div>

            <!-- Opción Global -->
            <div class="region-option" onclick="seleccionarMoneda('USD', 'Global')">
                <div class="region-info">
                    <div class="region-flag" style="background: #1e293b;">🌐</div>
                    <div>
                        <div class="region-name">Global</div>
                        <div class="region-currency">USD · $</div>
                    </div>
                </div>
                <div class="region-radio" id="radio-global"></div>
            </div>

            <!-- Opción Venezuela (Activa por defecto) -->
            <div class="region-option active" id="opt-venezuela" onclick="seleccionarMoneda('VES', 'Venezuela')">
                <div class="region-info">
                    <div class="region-flag">🇻🇪</div>
                    <div>
                        <div class="region-name">Venezuela</div>
                        <div class="region-currency">VES · Bs.</div>
                    </div>
                </div>
                <div class="region-radio" id="radio-ves">✓</div>
            </div>
        </div>
    </div>

    <div class="container">
        <header style="text-align: center; margin-bottom: 40px;">
            <h1>AssaX Store</h1>
            <p>Líderes en Entretenimiento</p>
        </header>

        <!-- Carrusel Principal -->
        <div class="carousel-container">
            <div class="carousel-track">
                <div class="carousel-slide"><img src="https://i.imgur.com/wMd8QmY.jpeg" alt="Banner 1"></div>
                <div class="carousel-slide"><img src="https://i.imgur.com/QLg6Fnl.png" alt="Banner 2"></div>
                <div class="carousel-slide"><img src="https://i.imgur.com/i6K1rEH.png" alt="Banner 3"></div>
            </div>
            <div class="carousel-indicators">
                <span class="dot active" onclick="goToSlide(0)"></span>
                <span class="dot" onclick="goToSlide(1)"></span>
                <span class="dot" onclick="goToSlide(2)"></span>
            </div>
        </div>
    </div>

    <script>
        // Funciones para el Modal de Región / Moneda
        function abrirModalRegion() {
            document.getElementById('modalRegion').style.display = 'flex';
        }

        function cerrarModalRegion() {
            document.getElementById('modalRegion').style.display = 'none';
        }

        function seleccionarMoneda(moneda, region) {
            document.getElementById('label-moneda').innerText = moneda;
            
            // Cambiar clases visuales activas
            const opciones = document.querySelectorAll('.region-option');
            opciones.forEach(opt => opt.classList.remove('active'));
            
            if
